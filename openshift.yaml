# Red Hat OpenShift on IBM LinuxONE deployment
apiVersion: apps/v1
kind: Deployment
metadata: {name: youthquest-api, labels: {app: youthquest}}
spec:
  replicas: 3
  selector: {matchLabels: {app: youthquest}}
  template:
    metadata: {labels: {app: youthquest}}
    spec:
      nodeSelector: {kubernetes.io/arch: s390x}
      containers:
      - name: api
        image: quay.io/youthquest/youthquest-ai:0.1.0
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /health, port: 8080}}
        resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: youthquest-api}
spec: {selector: {app: youthquest}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: youthquest-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: youthquest-api}
  minReplicas: 3
  maxReplicas: 50
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
